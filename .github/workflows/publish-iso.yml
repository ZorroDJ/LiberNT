name: Publish ISO

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful master build run id
        required: true
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
      source_sha:
        type: string
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-iso
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.source_sha != '' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Publish dated ISO release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 .github/scripts/publish_iso.py
