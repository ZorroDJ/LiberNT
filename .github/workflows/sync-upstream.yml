name: Sync upstream

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream/master
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)
          git fetch "${UPSTREAM_URL:-https://github.com/LiberNT/LiberNT.git}" master
          upstream=$(git rev-parse FETCH_HEAD)
          merge_status=0
          git merge --no-commit --no-ff "$upstream" || merge_status=$?
          if [ "$merge_status" != 0 ] && ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            exit "$merge_status"
          fi
          FORK_README_SOURCE="$before" bash .github/scripts/protect_upstream_readme.sh
          while read -r source destination; do
            cp "$source" "$destination"
            git add "$destination"
          done < .github/protected-files.txt
          conflicts=$(git diff --name-only --diff-filter=U)
          if [ -n "$conflicts" ]; then
            git merge --abort
            title="Upstream sync conflict ${upstream:0:11}"
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "$title in:title" --limit 1 --json number --jq '.[0].number // empty')
            if [ -z "$existing" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                --body "Sync of upstream $upstream onto fork $before stopped. Conflicting files: $conflicts. The published fork was left intact; resolve these conflicts before retrying."
            fi
            exit 1
          fi
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "[SYNC] Merge upstream master" \
              -m "Problem: the fork needs current upstream changes." \
              -m "Why: fork customizations must survive synchronization." \
              -m "How: merge clean changes and retain the canonical protected files."
          elif ! git diff --cached --quiet; then
            git commit -m "[SYNC] Restore protected fork files"
          fi
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            git push origin HEAD:master
          else
            echo "Upstream already merged; nothing to do."
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}

  publish:
    needs: [sync, build]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish-iso.yml
    with:
      run_id: ${{ github.run_id }}
      source_sha: ${{ needs.build.outputs.source_sha }}
