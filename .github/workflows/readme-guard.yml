name: Protected fork files

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Restore protected files
        run: |
          set -euo pipefail
          bash .github/scripts/protect_upstream_readme.sh
          while read -r source destination; do
            if ! cmp -s "$destination" "$source"; then
              cp "$source" "$destination"
              git add "$destination"
            fi
          done < .github/protected-files.txt
          git diff --cached --quiet && { echo "No protected files need restoring."; exit 0; }
          git commit -m "[SYNC] Preserve fork files after upstream import"
          git push origin HEAD:master
