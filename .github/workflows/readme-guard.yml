name: README guard

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Restore protected files
        run: |
          changed=0
          while read -r source destination; do
            if ! cmp -s "$destination" "$source"; then
              cp "$source" "$destination"
              git add "$destination"
              changed=1
            fi
          done < .github/protected-files.txt
          [ "$changed" = 1 ] || { echo "Protected files already intact."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: restore protected fork files after sync"
          git push
